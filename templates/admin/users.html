{% extends 'admin/base.html' %}{% block admin_content %}
<section class="card admin-section" id="users"><div class="card-heading"><h3>User management</h3>{{ icon('users') }}</div><div class="admin-form-list">{% for u in users %}<form method="post" action="{{ url_for('admin.update_user',ident=u.id) }}" class="user-edit-row">{{ csrf() }}<div><strong>{{ u.name }}</strong><small>{{ u.email }} · #{{ u.id }}</small></div><label class="field">Role<select name="role"><option value="user" {{ 'selected' if not u.is_admin }}>User</option><option value="admin" {{ 'selected' if u.is_admin }}>Admin</option></select></label><label class="field">Quota plan<select name="plan_id"><option value="">Workspace default</option>{% for p in plans %}<option value="{{ p.id }}" {{ 'selected' if p.id==u.plan_id }}>{{ p.name }}</option>{% endfor %}</select></label><label class="check-field"><input name="enabled" type="checkbox" value="1" {{ 'checked' if u.enabled }}><span>Enabled</span></label><button class="btn btn-secondary btn-sm">Save {{ icon('check') }}</button></form>{% if u.id!=current_user.id %}<form method="post" action="{{ url_for('admin.delete_user',ident=u.id) }}" class="user-delete-row" data-confirm="Permanently delete account {{ u.email }}? This is allowed only after its instances and active jobs are gone. Security audit history is retained.">{{ csrf() }}<input type="hidden" name="confirmation" value="{{ u.email }}"><span>Requires no instances or active jobs</span><button class="btn btn-danger btn-sm">{{ icon('user-minus') }} Delete account</button></form>{% endif %}{% endfor %}</div></section>
{% endblock %}
