{% if pagination.pages>1 %}<nav class="admin-pagination" aria-label="Page navigation">{% if pagination.has_prev %}<a class="btn btn-secondary btn-sm" href="{{ url_for(request.endpoint,page=pagination.prev_num,status=state|default('all'),instance=instance_filter|default('')) }}">{{ icon('arrow-left') }}Previous</a>{% endif %}<span class="muted">Page {{ pagination.page }} of {{ pagination.pages }} · {{ pagination.total }} records</span>{% if pagination.has_next %}<a class="btn btn-secondary btn-sm" href="{{ url_for(request.endpoint,page=pagination.next_num,status=state|default('all'),instance=instance_filter|default('')) }}">Next{{ icon('arrow-right') }}</a>{% endif %}</nav>{% endif %}
