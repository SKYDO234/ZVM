<form method="get" class="admin-job-filters"><label class="field">Status<select name="status">{% for value in (['active','queued','running','uncertain'] if admin_page=='recovery' else ['all','active','queued','running','uncertain','completed','failed','cancelled']) %}<option value="{{ value }}" {{ 'selected' if state==value }}>{{ value|title }}</option>{% endfor %}</select></label><label class="field">Instance ID <span class="optional">optional</span><input name="instance" value="{{ instance_filter }}" placeholder="Exact instance UUID"></label><button class="btn btn-secondary btn-sm">{{ icon('filter') }}Filter</button><a class="btn btn-ghost btn-sm" href="{{ url_for(request.endpoint) }}">Reset</a></form>
