<div class="job-recovery-actions">
<form method="post" action="{{ url_for('admin.cancel_job',ident=job.id) }}" data-job-recovery="can_cancel" {{ 'hidden' if not opts.can_cancel }} data-confirm="Cancel this queued request before the worker claims it? No engine operation will be replayed or performed.">{{ csrf() }}<button class="btn btn-secondary btn-sm">{{ icon('circle-x') }}Cancel queued request</button></form>
<form method="post" action="{{ url_for('admin.reconcile',ident=job.id) }}" data-job-recovery="can_reconcile" {{ 'hidden' if not opts.can_reconcile }}>{{ csrf() }}<button class="btn btn-secondary btn-sm">{{ icon('scan-search') }}Inspect actual outcome</button></form>
<form method="post" action="{{ url_for('admin.close_power_job',ident=job.id) }}" data-job-recovery="can_close_power" {{ 'hidden' if not opts.can_close_power }} data-confirm="Inspect the current real guest state and close this interrupted power request as failed/unconfirmed? This does not replay Start/Stop/Restart, remove a VPS, clear live work or release a storage allocation.">{{ csrf() }}<button class="btn btn-secondary btn-sm">{{ icon('shield-check') }}Close interrupted power request</button></form>
</div>
